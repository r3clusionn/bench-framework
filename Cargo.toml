[package]
name = "benchlab"
version = "0.3.0"
edition = "2021"
description = "A benchmarking harness with regression detection and microbenchmarks, plus Windows trace capture and WPA-style analysis: FPS and lows, slow frames explained, CPU, scheduling, DPC/ISR, hard faults and disk."
license = "MIT"

[lib]
name = "benchlab"

[[bin]]
name = "benchlab"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libm = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Etw",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Time",
]

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
debug = false

[target.'cfg(windows)'.dev-dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Performance",
  "Win32_UI_WindowsAndMessaging",
]
